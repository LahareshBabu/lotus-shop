name: LOTUS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-validation:
    name: Frontend Build & Security Audit
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Execute Security Audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Execute Unit Tests
      run: npm test

    - name: Validate Production Build
      run: npm run build
      env:
        # 🚀 THE FIX: Inject the vault secrets so the Next.js build doesn't crash!
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}

  backend-validation:
    name: ML Backend Test & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-api

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'ml-api/requirements.txt'

    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Python Linter
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Execute Security Scan
      run: safety check --json
      continue-on-error: true

    - name: Execute API Unit Tests
      env:
        # 🚀 THE FIX: Tell the robot to securely fetch the real keys from the GitHub Vault!
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: "."
      run: pytest tests/ -v --tb=short