name: LOTUS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-validation:
    name: Frontend Build & Test
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Execute Unit Tests
      run: npm test

    - name: Validate Production Build
      run: npm run build

  backend-validation:
    name: ML Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-api

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'ml-api/requirements.txt'

    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute API Smoke Test
      env:
        SUPABASE_URL: "https://dummy-url.supabase.co"
        SUPABASE_KEY: "dummy-key-12345"
      run: python -c "import main; print('API validation successful.')"