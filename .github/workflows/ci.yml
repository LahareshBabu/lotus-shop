name: LOTUS CI/CD Assembly Line

# 1. WHEN SHOULD THE ROBOTS WAKE UP?
# Every time you push code to the 'main' or 'master' branch.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. WHAT SHOULD THE ROBOTS DO?
jobs:
  frontend-inspector:
    name: 🌐 Frontend Robot (Next.js)
    runs-on: ubuntu-latest # The robot borrows a free Linux computer from GitHub

    steps:
    - name: 📦 Grab the Code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js Engine
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install All Required Packages
      run: npm ci

    - name: 🧪 Run Automated Tests
      run: npm test

    - name: 🏗️ Attempt to Build the Website
      # If this step fails, the robot flashes a red light and stops.
      run: npm run build

  backend-inspector:
    name: 🧠 ML Backend Robot (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-api # Tell this robot to only look inside the Python folder

    steps:
    - name: 📦 Grab the Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📥 Install ML Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 ML Engine Smoke Test
      # Proves the FastAPI server can compile and boot without crashing
      run: python -c "import main; print('✅ ML API successfully loaded and ready for production!')"